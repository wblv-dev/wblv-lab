[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wblv-lab"
version = "0.1.0.dev0"
description = "What is alive in the lab, and how to reach it — read-only."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["rich<16", "pexpect<5"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
wblv-lab = "wblv_lab.cli:run"

[tool.setuptools]
packages = ["wblv_lab", "wblv_lab.secrets"]          # explicit: legacy/ and tests/ are not part of the package

[tool.setuptools.package-data]
wblv_lab = ["config.example.toml"]   # --init writes this; must ship with the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
